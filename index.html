
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fce7f3">
    <title>Gül'e Küçük Bir Sürpriz ❤️</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main id="baslangic">
        <div class="baslangic-kalbi">♥</div>
        <h1>Gül Hanıma Sevgilerle 🌹</h1>
        <p>Sana küçük bir sürprizim var...</p>
        <button id="surprizButonu" type="button">Sürprizi Aç 💌</button>
    </main>

    <main id="sonEkran" aria-hidden="true">
        <div class="isikHalkasi"></div>

        <div class="kalp-sahnesi">
            <svg id="buyukKalp" viewBox="0 0 512 460"
                 xmlns="http://www.w3.org/2000/svg"
                 aria-hidden="true">
                <defs>
                    <linearGradient id="kalpRenkleri"
                                    x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffd6ed"/>
                        <stop offset="48%" stop-color="#efa9df"/>
                        <stop offset="100%" stop-color="#c6a0ff"/>
                    </linearGradient>
                </defs>

                <path id="kalpSekli"
                      d="M256 440
                         C220 405 28 280 28 150
                         C28 55 145 15 256 135
                         C367 15 484 55 484 150
                         C484 280 292 405 256 440 Z"/>
            </svg>

            <div id="kalpMesaji">
                <div id="ilkSatir">Seni seviyorum,</div>
                <div id="ikinciSatir">İyi ki varsın Gül ❤️</div>
            </div>
        </div>
    </main>

</body>
</html>
